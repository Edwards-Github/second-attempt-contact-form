<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Contact form</title>
  </head>
  <body>
    <main class="contact">
      <form novalidate>
        <h1>Contact Us</h1>
        <div class="form-group">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required />
        </div>

        <div class="form-group">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required />
        </div>

        <fieldset>
          <legend>Query Type</legend>
          <div class="form-group">
            <label for="general">General Enquiry</label>
            <input type="radio" id="general" name="query" />
          </div>

          <div class="form-group">
            <label for="support">Support Request</label>
            <input type="radio" id="support" name="query" />
          </div>
        </fieldset>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <div class="form-group">
          <input type="checkbox" name="consent" id="consent" required />
          <label for="consent" name="consent" id="consent"
            >I hereby consent to being contacted by the team</label
          >
        </div>

        <button>Submit</button>
      </form>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Edward</a>.
    </footer>
  </body>
</html>
